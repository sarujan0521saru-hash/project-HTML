<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page of zoro</title>
</head>
<body>
    <!-- it's for navigation bar -->
    <div class="button">
        <button>home</button>
        <button>search</button>
        <button>about</button>
        <button>contact us</button>
    </div>

    <!-- heading -->
    <h1>KING OF HELL</h1>

    <!-- main login box -->
    <div class="label">

        <!-- for name (text and input) -->
        <div class="Lname">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        </div>

        <!-- for birth of date (text and input) -->
        <div class="Lage">
        <label for="BOD">BOD:</label>
        <input type="date" name="age" id="BOD"><br><br>
        </div>

        <!-- for number (text and input) -->
        <div class="Lnumber">
        <label for="p.number">P.Number:</label>
        <input type="number" name="phone" id="number"><br><br>
        </div>

        <!-- for gender (text and input) -->
        <div class="Lgender">
        <label for="gender">Gender:</label>
        <label for="male">male</label>
        <input type="checkbox" name="male" id="male">
        <label for="female">female</label>
        <input type="checkbox" name="female" id="female"><br><br>
        </div>
    </div>
</body>
</html>
